[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200

# Remappings
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/=lib/openzeppelin-contracts/",
]

# Fork testing against Arc L1 Testnet
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

# All tests run locally (no fork required for unit tests)
# Use --fork-url flag for integration tests against Arc Testnet
# [profile.default.fork]
# url = "https://rpc.testnet.arc.network"
# chain_id = 5042002

# Fuzz testing configuration
[fuzz]
runs = 256
max_test_rejects = 65536
seed = "0x1"

# Invariant testing configuration
[invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
